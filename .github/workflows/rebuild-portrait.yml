name: Rebuild portrait

on:
  push:
    branches: main
    paths:
      - '.github/workflows/rebuild-portrait.yml'
      - 'tmp-image/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild portrait image
        shell: bash
        run: |
          cat tmp-image/c360_1.txt tmp-image/c360_2.txt tmp-image/c360_3.txt tmp-image/c360_4.txt tmp-image/c360_5.txt tmp-image/c360_6.txt | base64 -d > assets/pablo-bueno-cartoon-red.jpg
          test "$(stat -c%s assets/pablo-bueno-cartoon-red.jpg)" -eq 35421

      - name: Commit portrait
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pablo-bueno-cartoon-red.jpg
          git commit -m "Rebuild red-shirt cartoon portrait" || exit 0
          git push
